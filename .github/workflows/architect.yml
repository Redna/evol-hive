name: Architect

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string

jobs:
  draft-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Architect Agent
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          export ISSUE_FILE=".pi/tasks/current-issue.md"
          gh issue view $ISSUE_NUMBER --json body,title,labels > $ISSUE_FILE

          pi -p "/goal $(cat .pi/tasks/draft-spec.md)" \
            --append-system-prompt "$(cat .pi/agents/architect.md)" \
            --model ollama/glm-5.2 \
            --thinking high \
            --tools read,bash