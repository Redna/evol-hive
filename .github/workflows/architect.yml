name: Architect

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string

jobs:
  draft-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cache YAAM daemon binary (30MB, avoids rebuilding Rust on every run)
      - name: Cache YAAM binary
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v1

      # Cache ONNX model files (134MB, never changes)
      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      # Restore YAAM memory from the memory branch (durable, versioned)
      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Restore YAAM memory
        run: bash scripts/restore-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Architect Agent
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          # Get issue data
          export ISSUE_FILE=".pi/tasks/current-issue.md"
          gh issue view $ISSUE_NUMBER --json body,title,labels > $ISSUE_FILE || { echo "gh issue view failed"; exit 1; }

          # Interpolate ISSUE_NUMBER into the task template
          TASK_CONTENT=$(ISSUE_NUMBER=$ISSUE_NUMBER envsubst < .pi/tasks/draft-spec.md)

          # Run the agent (print mode: multi-turn tool use)
          pi -p "$TASK_CONTENT" \
            --append-system-prompt "$(cat .pi/agents/architect.md)" \
            --model ollama/glm-5.2 \
            --thinking high \
            --tools read,bash \
            --verbose

      - name: Push agent commits
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # PAT for PR creation — triggers pull_request events
        run: |
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" != "main" ]; then
            echo "On branch: $BRANCH"
            git push -u origin "$BRANCH" 2>/dev/null || echo "Branch already pushed"
            gh pr create --base main --head "$BRANCH" \
              --title "spec: draft for issue #${ISSUE_NUMBER}" \
              --body "Drafts specification for issue #${ISSUE_NUMBER}" 2>/dev/null || \
              echo "PR creation failed — create manually"
          elif git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing main commits..."
            git push origin HEAD:main
          else
            echo "No unpushed commits."
          fi

      # Save YAAM memory to the memory branch (durable, versioned)
      - name: Save YAAM memory
        if: always()
        run: bash scripts/save-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}