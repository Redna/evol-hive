name: Architect

on:
  # dispatch-only: the issues:labeled hook caused self-retrigger loops (the
  # Architect labels the issue "Status: Ready for Dev" mid-run, firing itself
  # again with empty event context — see duplicate PR #119).
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
      retry_count:
        description: 'Internal: number of automatic retries used'
        required: false
        type: string
        default: '0'

concurrency:
  # Own group: a spec-draft run must NOT queue behind a long Developer/QA run
  # for another issue and then be pending-cancelled (issue #206, 2026-09-15).
  # Phase serialization within one pipeline is already enforced by
  # scripts/pipeline.sh, which waits for each phase before dispatching the next.
  group: agent-pipeline-architect
  cancel-in-progress: false

jobs:
  draft-spec:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'Status: Needs Architecture')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache YAAM binary
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v3

      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Restore YAAM memory
        run: bash scripts/restore-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Architect Agent
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          # Get issue data
          export ISSUE_FILE=".pi/tasks/current-issue.md"
          gh issue view $ISSUE_NUMBER --json body,title,labels > $ISSUE_FILE || { echo "gh issue view failed"; exit 1; }

          # Interpolate ISSUE_NUMBER into the task template
          TASK_CONTENT=$(ISSUE_NUMBER=$ISSUE_NUMBER envsubst < .pi/tasks/draft-spec.md)

          # Run the agent (print mode: multi-turn tool use)
          # Resource heartbeat: log memory/disk/load every 20s — proves or
          # disproves OOM-based runner reclamation and keeps the job log active
          # while pi waits on the first LLM token.
          (
            N=0
            while true; do
              N=$((N+1))
              echo "[heartbeat] $(date -u +%H:%M:%S) mem=$(free -m | awk 'NR==2{print $3"/"$2"MB"}') swap=$(free -m | awk 'NR==3{print $3"/"$2"MB"}') disk=$(df -h / | awk 'NR==2{print $5" used"}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              if [ $((N % 3)) -eq 0 ]; then
                ps aux --sort=-rss | awk 'NR<=4 && NR>1 {printf "[topmem] %s %sMB %s\n", $1, int($6/1024), $11}' | head -3
              fi
              sleep 20
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          pi -p "$TASK_CONTENT" \
            --append-system-prompt "$(cat .pi/agents/architect.md)" \
            --model ollama/deepseek-v4.1-flash \
            --thinking high \
            --tools read,bash \
            --verbose

      - name: Push agent commits
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" != "main" ]; then
            echo "On branch: $BRANCH"
            git push -u origin "$BRANCH" 2>/dev/null || echo "Branch already pushed"
            gh pr create --base main --head "$BRANCH" \
              --title "spec: draft for issue #${ISSUE_NUMBER}" \
              --body "Drafts specification for issue #${ISSUE_NUMBER}" 2>/dev/null || \
              echo "PR creation failed — create manually"
          elif git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing main commits..."
            git push origin HEAD:main
          else
            echo "No unpushed commits."
          fi

      - name: Guard the spec PR against closing keywords
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" = "main" ] || [ -z "$BRANCH" ]; then
            echo "Not on a spec branch — nothing to guard."
            exit 0
          fi

          PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR found for $BRANCH — nothing to guard."
            exit 0
          fi

          # GitHub matches close/fix/resolve keywords case-insensitively ANYWHERE,
          # including prose: "close #210; the issue stays open ..." closed #210 when
          # the spec PR #211 merged (2026-09-15). A spec PR must never close the issue.
          gh pr view "$PR" --json body --jq '.body // ""' > /tmp/spec-pr-body.md
          python3 -c "import re,sys; b=open('/tmp/spec-pr-body.md').read(); p=re.compile(r'(?i)\b(closes?|closed|fix(?:es|ed)?|resolve[sd]?)\b\s*:?\s*(?=#[0-9])'); f,n=p.subn('Refs ',b); sys.stderr.write('sanitized %d closing keyword(s)\n' % n); open('/tmp/spec-pr-body-fixed.md','w').write(f)"
          if ! cmp -s /tmp/spec-pr-body.md /tmp/spec-pr-body-fixed.md; then
            gh pr edit "$PR" --body-file /tmp/spec-pr-body-fixed.md
            echo "::warning::Spec PR #$PR body contained a closing keyword before an issue reference — rewritten to 'Refs' so the issue stays open until the implementation PR lands."
          else
            echo "Spec PR #$PR body is clean."
          fi

          # Commit messages on the spec branch are parsed the same way on merge.
          BAD=$(git log "origin/main..HEAD" --format=%B | grep -nEi '\b(closes?|closed|fix(es|ed)?|resolve[sd]?)\b[[:space:]]*:?[[:space:]]*#[0-9]+' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Spec branch commit messages contain a closing keyword before an issue reference — rewrite them before merging (the spec PR must not close the issue):"
            echo "$BAD"
            exit 1
          fi

      - name: Save YAAM memory
        if: always()
        run: bash scripts/save-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
