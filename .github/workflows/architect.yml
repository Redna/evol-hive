name: Architect

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string

jobs:
  draft-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cache YAAM daemon binary (30MB, avoids rebuilding Rust on every run)
      - name: Cache YAAM binary
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v1

      # Cache ONNX model files (134MB, never changes)
      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      # Cache events.jsonl for inter-agent memory persistence
      - name: Restore YAAM memory
        uses: actions/cache@v4
        with:
          path: events.jsonl
          key: yaam-events-${{ github.run_id }}
          restore-keys: |
            yaam-events-

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Architect Agent
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          # Get issue data
          export ISSUE_FILE=".pi/tasks/current-issue.md"
          gh issue view $ISSUE_NUMBER --json body,title,labels > $ISSUE_FILE || { echo "gh issue view failed"; exit 1; }

          # Interpolate ISSUE_NUMBER into the task template
          TASK_CONTENT=$(ISSUE_NUMBER=$ISSUE_NUMBER envsubst < .pi/tasks/draft-spec.md)

          # Run the agent (print mode: multi-turn tool use)
          pi -p "$TASK_CONTENT" \
            --append-system-prompt "$(cat .pi/agents/architect.md)" \
            --model ollama/glm-5.2 \
            --thinking high \
            --tools read,bash \
            --verbose

      - name: Push agent commits
        run: |
          # Check if there are unpushed commits and push them
          if git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing agent commits..."
            git push origin HEAD:main
          else
            echo "No unpushed commits."
          fi

      # Save updated events.jsonl for the next agent run
      - name: Save YAAM memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: events.jsonl
          key: yaam-events-${{ github.run_id }}