name: Developer

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: string
      retry_count:
        description: "Internal: number of automatic retries used"
        required: false
        type: string
        default: "0"

concurrency:
  group: agent-pipeline
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
      contents: write
      pull-requests: write
      checks: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache YAAM binary
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v2

      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Restore YAAM memory
        run: bash scripts/restore-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Developer Agent
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          # Find the spec file for this issue — INDEX.md, then grep. NO fallback
          # to "latest spec": that once made the agent implement a stale spec
          # for the wrong issue (PR #116). If there's no spec, say so and stop —
          # the Architect must draft one first.
          export SPEC_FILE=$(grep "issues/${ISSUE_NUMBER}" docs/specs/INDEX.md 2>/dev/null | grep -oP '\d{3}-[^]]*\.md' | head -1)

          if [ -z "$SPEC_FILE" ]; then
            export SPEC_FILE=$(grep -rl "#${ISSUE_NUMBER}" docs/specs/*.md 2>/dev/null | grep -v INDEX | grep -v TEMPLATE | head -1)
            SPEC_FILE=$(basename "${SPEC_FILE:-}")
            export SPEC_FILE
          fi

          if [ -z "$SPEC_FILE" ] || [ "$SPEC_FILE" = "INDEX.md" ]; then
            echo "No spec found for issue #${ISSUE_NUMBER}"
            gh issue comment $ISSUE_NUMBER --body "⚠️ No spec file found. The Architect must draft a spec first."
            exit 1
          fi

          echo "Using spec: $SPEC_FILE"

          # Interpolate variables into the task template
          TASK_CONTENT=$(ISSUE_NUMBER=$ISSUE_NUMBER SPEC_FILE=$SPEC_FILE envsubst < .pi/tasks/implement.md)

          # Resource heartbeat: logs memory/disk every 20s to the job log and a
          # file. Two purposes: (a) prove/disprove the runner-reclamation-by-OOM
          # theory — the last readings before a shutdown signal are captured;
          # (b) keep log output flowing while pi waits on the first LLM token.
          (
            N=0
            while true; do
              N=$((N+1))
              echo "[heartbeat] $(date -u +%H:%M:%S) mem=$(free -m | awk 'NR==2{print $3"/"$2"MB"}') swap=$(free -m | awk 'NR==3{print $3"/"$2"MB"}') disk=$(df -h / | awk 'NR==2{print $5" used"}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              if [ $((N % 3)) -eq 0 ]; then
                ps aux --sort=-rss | awk 'NR<=4 && NR>1 {printf "[topmem] %s %sMB %s\n", $1, int($6/1024), $11}' | head -3
              fi
              sleep 20
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          # Run the agent with a continuation loop. pi print-mode exits whenever
          # the model emits a text-only response instead of a tool call — common
          # with glm-5.3-flash mid-implementation (it narrates "Now add X" and
          # quits). Each pass resumes from the pushed branch + YAAM notes, so
          # checkpointed work survives; uncommitted work does not.
          PI_ARGS=(
            -p "$TASK_CONTENT"
            --append-system-prompt "$(cat .pi/agents/developer.md)"
            --model ollama/glm-5.3-flash
            --thinking medium
            --tools read,write,edit,bash
            --verbose
          )
          PR_CREATED=0
          for PASS in 1 2 3; do
            echo "=== Agent pass $PASS/3 ==="
            pi "${PI_ARGS[@]}"
            PI_EXIT=$?
            echo "pi exited (code $PI_EXIT) — checking goal state"
            # Goal reached? An open PR whose branch has implementation commits.
            PR_NUM=$(gh pr list --state open --json number,headRefName \
              --jq "[] | map(select(.headRefName | test(\"feature/${ISSUE_NUMBER}[-_]|feature-0*${ISSUE_NUMBER}\"))) | .[0].number // empty")
            if [ -n "$PR_NUM" ]; then
              COMMITS=$(git rev-list --count origin/main.."$(gh pr view "$PR_NUM" --json headRefName --jq .headRefName)" 2>/dev/null || echo 0)
              if [ "${COMMITS:-0}" -gt 0 ]; then
                echo "PR #$PR_NUM exists with $COMMITS commits — implementation complete"
                PR_CREATED=1
                break
              fi
            fi
            if [ "$PASS" = "3" ]; then
              echo "3 passes exhausted without a complete PR"
              break
            fi
            echo "Pass $PASS ended without completing the goal — re-invoking with continue.md"
            TASK_CONTENT=$(ISSUE_NUMBER=$ISSUE_NUMBER SPEC_FILE=$SPEC_FILE envsubst < .pi/tasks/continue.md)
            PI_ARGS=(
              -p "$TASK_CONTENT"
              --append-system-prompt "$(cat .pi/agents/developer.md)"
              --model ollama/glm-5.3-flash
              --thinking medium
              --tools read,write,edit,bash
              --verbose
            )
          done

      - name: Push agent commits
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}  # PAT for PR creation — triggers pull_request events
        run: |
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" != "main" ]; then
            echo "On feature branch: $BRANCH"
            git push -u origin "$BRANCH" 2>/dev/null || echo "Branch already pushed"
            # Try to create PR using GH_TOKEN (if available) or GITHUB_TOKEN
            gh pr create --base main --head "$BRANCH" \
              --title "feat: implementation for issue #${ISSUE_NUMBER}" \
              --body "Implements spec: ${SPEC_FILE}\n\nCloses #${ISSUE_NUMBER}" 2>/dev/null || \
              echo "PR creation failed — create manually at: https://github.com/Redna/evol-hive/pull/new/$BRANCH"
          elif git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing main commits..."
            git push origin HEAD:main
          else
            echo "No unpushed commits."
          fi

      - name: Save YAAM memory
        if: always()
        run: bash scripts/save-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      # GitHub-hosted runners intermittently cancel these long, mostly-idle
      # agent jobs ("The runner has received a shutdown signal", no auto-retry,
      # ~50% of runs — see issue #112 follow-up). Re-dispatch once on failure;
      # the retry_count input prevents infinite loops.
      - name: Auto-retry on runner cancellation
        if: failure() && github.event.inputs.retry_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          echo "Job failed — re-dispatching developer (retry 1/1) for issue #${ISSUE_NUMBER}"
          gh workflow run developer.yml \
            --ref main \
            -f issue_number="${ISSUE_NUMBER}" \
            -f retry_count="1"
          echo "Re-dispatched."