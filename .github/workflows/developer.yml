name: Developer

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'Status: Ready for Dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
      contents: write
      pull-requests: write
      checks: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Developer Agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          # Find the spec file for this issue
          export SPEC_FILE=$(grep -rl "issue #${ISSUE_NUMBER}" docs/specs/ 2>/dev/null | head -1)
          
          if [ -z "$SPEC_FILE" ]; then
            echo "No spec found for issue #${ISSUE_NUMBER}"
            gh issue comment $ISSUE_NUMBER --body "⚠️ No spec file found. The Architect must draft a spec first (label 'Status: Needs Architecture')."
            exit 1
          fi
          
          pi -p "/goal $(cat .pi/tasks/implement.md)" \
            --append-system-prompt "$(cat .pi/agents/developer.md)" \
            --model ollama/glm-5.2 \
            --thinking medium \
            --tools read,write,edit,bash