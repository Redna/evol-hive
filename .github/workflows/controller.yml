name: Controller

on:
  workflow_run:
    workflows: ["Architect", "Developer", "QA", "Doctor", "CI"]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  # Orchestration: runs when any agent workflow completes
  orchestrate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Controller
        env:
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
          COMPLETED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_PAT: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/controller.sh

  # Auto-dispatch: runs when a spec PR is merged
  on-spec-merged:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'spec/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Dispatch Developer from merged spec PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract issue number from PR title or body (format: "issue #N" or "#N")
          ISSUE_NUMBER=$(echo "$PR_TITLE $PR_BODY" | grep -oP '#(\d+)' | head -1 | tr -d '#')
          
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Could not find issue number in PR title/body: $PR_TITLE"
            exit 0
          fi
          
          echo "Spec PR merged for issue #$ISSUE_NUMBER"
          
          # Post comment on the issue
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Redna/evol-hive/issues/$ISSUE_NUMBER/comments" \
            -d "{\"body\": \"## 📋 Spec PR merged — Developer dispatched automatically\n\nThe spec has been merged to main. The Developer agent is now being dispatched to implement the feature.\"}" > /dev/null
          
          # Dispatch the Developer workflow
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Redna/evol-hive/actions/workflows/327276210/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"issue_number\":\"$ISSUE_NUMBER\"}}" > /dev/null
          
          echo "Developer dispatched for issue #$ISSUE_NUMBER"