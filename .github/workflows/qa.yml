name: QA

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to verify"
        required: true
        type: string

jobs:
  verify-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
      issues: write

    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Checkout (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache YAAM binary
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v1

      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      - name: Restore YAAM memory
        run: bash scripts/restore-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run QA Agent
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          # Interpolate PR_NUMBER into the task template
          TASK_CONTENT=$(PR_NUMBER=$PR_NUMBER envsubst < .pi/tasks/qa-verify.md)

          pi -p "$TASK_CONTENT" \
            --append-system-prompt "$(cat .pi/agents/qa-tester.md)" \
            --model ollama/glm-5.2 \
            --thinking medium \
            --tools read,write,edit,bash \
            --verbose

      - name: Push QA test commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH=$(git branch --show-current)
          if git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing QA test commits to $BRANCH..."
            git push origin HEAD:$BRANCH 2>/dev/null || echo "Push failed or nothing to push"
          else
            echo "No unpushed commits."
          fi

      - name: Save YAAM memory
        if: always()
        run: bash scripts/save-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}