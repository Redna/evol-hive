name: QA

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to verify (fallback if pull_request event didn't fire)"
        required: true
        type: string
      retry_count:
        description: "Internal: number of automatic retries used"
        required: false
        type: string
        default: "0"

concurrency:
  group: agent-pipeline
  cancel-in-progress: false

jobs:
  verify-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
      issues: write

    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      # `refs/pull/N/head` is a detached HEAD: `git branch --show-current` is
      # empty, so the push step below had nothing to push and any QA test work
      # was lost (PR #213, 2026-09-15). Materialize the PR's real branch so QA
      # artifacts can land.
      - name: Check out the PR branch (workflow_dispatch lands detached)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH=$(gh pr view "${{ inputs.pr_number }}" --json headRefName -q .headRefName)
          echo "Checking out branch '$BRANCH'"
          git checkout -B "$BRANCH"

      # Issue #217: a docs-only PR (every spec PR) has no implementation whose
      # coverage QA could verify — its task is "map each acceptance criterion to
      # existing tests" and "write missing tests", which for an unimplemented spec
      # yields nothing (QA reported 0/6 code ACs testable on spec 060) while still
      # holding the shared `agent-pipeline` slot for ~15 minutes and delaying the
      # Developer run that follows it. Detect that here, before the toolchain and
      # the agent, and short-circuit the work below. The check still reports
      # SUCCESS rather than being skipped: a never-reported required check leaves
      # the PR at "Expected — waiting for status", which is what this fixes.
      - name: Detect a docs-only PR (issue #217)
        id: docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          # `--paginate` matters: `gh pr view --json files` caps its list at 100
          # entries, so a large PR would look docs-only and skip QA silently.
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          echo "Changed files:"; printf '%s\n' "$CHANGED"
          # Documentation = `docs/**` (specs, their notes and assets), `.pi/**`
          # (agent/task prompt templates) and any `*.md` file.
          NON_DOC=$(printf '%s\n' "$CHANGED" | grep -vE '^(docs/|\.pi/|.*\.md$)' | grep -v '^$' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=QA skipped (docs-only PR)::No code to verify coverage for — acceptance-criterion coverage is deferred to the implementation PR for this spec. This PR's gate is the human spec review, not verify-coverage."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-doc files present — running the full QA verification."
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache YAAM binary
        if: steps.docs.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v3

      - name: Cache ONNX model
        if: steps.docs.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      - name: Restore YAAM memory
        if: steps.docs.outputs.docs_only != 'true'
        run: bash scripts/restore-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Bootstrap agent environment
        if: steps.docs.outputs.docs_only != 'true'
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run QA Agent
        if: steps.docs.outputs.docs_only != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          # Interpolate PR_NUMBER into the task template
          TASK_CONTENT=$(PR_NUMBER=$PR_NUMBER envsubst < .pi/tasks/qa-verify.md)

          # Resource heartbeat: log memory/disk/load every 20s — proves or
          # disproves OOM-based runner reclamation and keeps the job log active
          # while pi waits on the first LLM token.
          (
            N=0
            while true; do
              N=$((N+1))
              echo "[heartbeat] $(date -u +%H:%M:%S) mem=$(free -m | awk 'NR==2{print $3"/"$2"MB"}') swap=$(free -m | awk 'NR==3{print $3"/"$2"MB"}') disk=$(df -h / | awk 'NR==2{print $5" used"}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              if [ $((N % 3)) -eq 0 ]; then
                ps aux --sort=-rss | awk 'NR<=4 && NR>1 {printf "[topmem] %s %sMB %s\n", $1, int($6/1024), $11}' | head -3
              fi
              sleep 20
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          pi -p "$TASK_CONTENT" \
            --append-system-prompt "$(cat .pi/agents/qa-tester.md)" \
            --model ollama/deepseek-v4.1-flash \
            --thinking medium \
            --tools read,write,edit,bash \
            --verbose

      - name: Push QA test commits
        if: steps.docs.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          BRANCH=$(git branch --show-current)
          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
            git checkout -B "$BRANCH"
          fi
          # This step pushes COMMITS only. QA's artifacts are its test additions
          # and its coverage notes, so commit them here when the agent left them
          # in the working tree (that is how PR #213's QA tests were lost).
          if [ -n "$(git status --porcelain -- packages/*/tests docs/specs/notes)" ]; then
            git add -A -- packages/*/tests docs/specs/notes 2>/dev/null || true
            git commit -m "test(qa): verify-coverage additions for PR #${PR_NUMBER}" || true
          fi
          if git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing QA test commits to $BRANCH..."
            git push origin "HEAD:$BRANCH" || echo "::warning::QA push failed — QA artifacts are NOT on the branch"
            # A GITHUB_TOKEN push does not trigger workflows, so validate the QA
            # commit explicitly instead of letting it land unverified.
            gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::could not dispatch CI for the QA commit"
          else
            echo "No unpushed commits."
          fi

      - name: Save YAAM memory
        if: always() && steps.docs.outputs.docs_only != 'true'
        run: bash scripts/save-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}