name: Doctor

on:
  check_run:
    types: [completed]

jobs:
  diagnose:
    # Only run on PRs from the same repo (not forks) and only on CI failures
    if: |
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.name == 'CI' &&
      github.event.check_run.check_suite.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_run.check_suite.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Doctor Agent
        env:
          PR_NUMBER: ${{ github.event.check_run.check_suite.pull_requests[0].number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this check run"
            exit 0
          fi
          
          pi -p "/goal $(cat .pi/tasks/diagnose.md)" \
            --append-system-prompt "$(cat .pi/agents/doctor.md)" \
            --model ollama/glm-5.2 \
            --thinking high \
            --tools read,bash,edit,write