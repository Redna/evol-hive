name: Doctor

on:
  check_run:
    types: [completed]

concurrency:
  group: agent-pipeline
  cancel-in-progress: false

jobs:
  diagnose:
    if: |
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.check_suite.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_run.check_suite.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache YAAM binary
        uses: actions/cache@v4
        with:
          path: ~/.yaam-cache
          key: yaam-binary-v2

      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.yaam/models
          key: yaam-model-v1

      - name: Generate App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Restore YAAM memory
        run: bash scripts/restore-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Bootstrap agent environment
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash scripts/bootstrap-agent.sh

      - name: Run Doctor Agent
        env:
          PR_NUMBER: ${{ github.event.check_run.check_suite.pull_requests[0].number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -x

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this check run"
            exit 0
          fi

          TASK_CONTENT=$(PR_NUMBER=$PR_NUMBER envsubst < .pi/tasks/diagnose.md)

          # Resource heartbeat: log memory/disk/load every 20s — proves or
          # disproves OOM-based runner reclamation and keeps the job log active
          # while pi waits on the first LLM token.
          (
            while true; do
              echo "[heartbeat] $(date -u +%H:%M:%S) mem=$(free -m | awk 'NR==2{print $3"/"$2"MB"}') disk=$(df -h / | awk 'NR==2{print $5" used"}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              sleep 20
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          pi -p "$TASK_CONTENT" \
            --append-system-prompt "$(cat .pi/agents/doctor.md)" \
            --model ollama/glm-5.3-flash \
            --thinking high \
            --tools read,bash,edit,write \
            --verbose

      - name: Push Doctor fixes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git log --branches --not --remotes --oneline | grep -q .; then
            echo "Pushing Doctor fixes..."
            git push origin HEAD:${{ github.event.check_run.check_suite.pull_requests[0].head.ref }}
          else
            echo "No unpushed commits."
          fi

      - name: Save YAAM memory
        if: always()
        run: bash scripts/save-memory.sh
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}