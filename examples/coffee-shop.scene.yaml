# Coffee Shop Scene — declarative equivalent of examples/coffee-shop.ts (spec 022, Req 17)
# ────────────────────────────────────────────────────────────────────────────
# This file is the YAML serialization of the COFFEE_SHOP_SCENE defined in
# examples/coffee-shop.ts. It contains the same rooms, objects, and agents.
# Doorway objects are NOT listed here — they are auto-generated by the scene
# loader (spec 022, Req 12) based on room connections.

id: coffee-shop
name: Coffee Shop
rooms:
  - id: kitchen
    name: Kitchen
    description: A kitchen with a coffee machine and sink.
    connections:
      - living_room
      - garden
    objectIds:
      - coffee-1
      - sink-1
  - id: living_room
    name: Living Room
    description: A living room with a bookshelf and sofa.
    connections:
      - kitchen
      - bathroom
      - garden
    objectIds:
      - bookshelf-1
      - sofa-1
  - id: bathroom
    name: Bathroom
    description: A small bathroom with a toilet.
    connections:
      - living_room
    objectIds:
      - toilet-1
  - id: garden
    name: Garden
    description: A garden with a bench and flower bed.
    connections:
      - living_room
      - kitchen
    objectIds:
      - bench-1
      - flowerbed-1

objects:
  # Coffee Machine — compound action, state rules, conditional affordances, dependencies
  - id: coffee-1
    name: Coffee Machine
    type: appliance
    state:
      water_level: 5
      bean_count: 10
      cup_count: 3
    roomId: kitchen
    affordances:
      - id: add_water
        label: Add water
        engineEffect: add_water
        preconditions: []
        effects: {}
        stepGroup: brew_coffee_sequence
        stepOrder: 1
        conditions:
          - field: water_level
            operator: '<'
            value: 5
      - id: brew_coffee
        label: Brew coffee
        engineEffect: brew_coffee
        preconditions:
          - has_water
          - has_beans
        effects:
          energy: 20
        stepGroup: brew_coffee_sequence
        stepOrder: 2
        conditions:
          - field: water_level
            operator: '>'
            value: 0
          - field: bean_count
            operator: '>'
            value: 0
      - id: pour_cup
        label: Pour a cup
        engineEffect: pour_cup
        preconditions:
          - has_cups
        effects:
          comfort: 5
        stepGroup: brew_coffee_sequence
        stepOrder: 3
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}
    stateRules:
      - field: water_level
        operation: decay
        rate: 0.1
        interval: 1
      - field: water_level
        operation: approach
        rate: 0.5
        target: 5
        interval: 1
    compoundActions:
      - id: brew_coffee_sequence
        label: Brew a cup of coffee
        steps:
          - affordanceId: add_water
            description: Add water to the machine
          - affordanceId: brew_coffee
            description: Brew the coffee
          - affordanceId: pour_cup
            description: Pour into a cup
    dependencies:
      - affordanceId: add_water
        requiresObjectId: sink-1
        requiresAffordance: refill_pitcher
        description: Must refill the pitcher at the Sink before adding water to the Coffee Machine.

  # Sink — cross-object state change via refill_pitcher
  - id: sink-1
    name: Sink
    type: fixture
    state:
      water_supply: 20
    roomId: kitchen
    affordances:
      - id: refill_pitcher
        label: Refill pitcher
        engineEffect: refill_pitcher
        preconditions:
          - has_water_supply
        effects: {}
      - id: wash_hands
        label: Wash hands
        engineEffect: wash_hands
        preconditions: []
        effects:
          comfort: 5
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}
    stateRules:
      - field: water_supply
        operation: decay
        rate: 0.05
        interval: 1

  # Bookshelf — conditional affordance (book_count > 0)
  - id: bookshelf-1
    name: Bookshelf
    type: furniture
    state:
      book_count: 8
    roomId: living_room
    affordances:
      - id: read_book
        label: Read a book
        engineEffect: read_book
        preconditions:
          - has_books
        effects:
          curiosity: 20
          energy: -10
        conditions:
          - field: book_count
            operator: '>'
            value: 0
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}

  # Sofa — relax affordance
  - id: sofa-1
    name: Sofa
    type: furniture
    state: {}
    roomId: living_room
    affordances:
      - id: relax
        label: Relax on the sofa
        engineEffect: relax
        preconditions: []
        effects:
          comfort: 20
          energy: 5
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}

  # Toilet — use_bathroom
  - id: toilet-1
    name: Toilet
    type: fixture
    state: {}
    roomId: bathroom
    affordances:
      - id: use_bathroom
        label: Use the bathroom
        engineEffect: use_bathroom
        preconditions: []
        effects:
          comfort: 10
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}

  # Garden Bench — sit_outside
  - id: bench-1
    name: Garden Bench
    type: furniture
    state: {}
    roomId: garden
    affordances:
      - id: sit_outside
        label: Sit outside
        engineEffect: sit_outside
        preconditions: []
        effects:
          comfort: 15
          curiosity: 5
          energy: 3
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}

  # Flower Bed — conditional affordance (bloom_count > 0), state rules
  - id: flowerbed-1
    name: Flower Bed
    type: nature
    state:
      bloom_count: 5
    roomId: garden
    affordances:
      - id: observe_flowers
        label: Observe flowers
        engineEffect: observe_flowers
        preconditions:
          - has_blooms
        effects:
          curiosity: 10
          comfort: 5
        conditions:
          - field: bloom_count
            operator: '>'
            value: 0
      - id: observe
        label: Observe
        engineEffect: observe
        preconditions: []
        effects: {}
    stateRules:
      - field: bloom_count
        operation: decay
        rate: 0.02
        interval: 1
      - field: bloom_count
        operation: approach
        rate: 0.1
        target: 5
        interval: 1

agents:
  - id: agent-alice
    name: Alice
    description: A caffeine-dependent person who needs coffee to function.
    traits:
      - diligent
      - caffeine-dependent
    initialDrives:
      energy: 15
      hunger: 60
      social: 40
      comfort: 50
      curiosity: 30
    startRoomId: kitchen

  - id: agent-bob
    name: Bob
    description: A social person who seeks company and conversation.
    traits:
      - social
      - easygoing
    initialDrives:
      energy: 50
      hunger: 40
      social: 15
      comfort: 60
      curiosity: 50
    startRoomId: living_room

  - id: agent-carol
    name: Carol
    description: A curious analyst who wants to explore and learn.
    traits:
      - curious
      - analytical
    initialDrives:
      energy: 60
      hunger: 30
      social: 50
      comfort: 40
      curiosity: 15
    startRoomId: garden